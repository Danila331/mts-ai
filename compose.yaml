# Весь стенд одной командой: фронт и виджет (Next), Go-API, Python-ядро,
# шлюз к моделям (со своей базой), Postgres, Redis и Prometheus.
#
#   docker compose up --build        # стенд: http://localhost:3000
#                                    # API: http://localhost:8787, Prometheus: http://localhost:9090
#
# Для разработки фронта с горячей перезагрузкой — `cd web && npm run dev`
# поверх того же compose: службу web тогда можно не поднимать
# (docker compose up --build api), а прокси Next по умолчанию ходит на
# API по 127.0.0.1:8787 (EB_API_URL).
#
# Ключ модели берётся из .env в корне — того же, что читает ядро при
# запуске без docker, — но знает его только шлюз (llm-gateway): ядро и
# api ходят к модели через него, по псевдонимам energy-*. Без ключа стенд
# поднимается, но отвечает заглушкой.
#
# Порты публикуются только на петлю: без явного адреса docker слушает
# 0.0.0.0 и правит iptables сам, в обход хостового межсетевого экрана,
# и база с паролем из этого файла оказалась бы видна всей сети вокруг.
name: energytool

services:
  db:
    image: postgres:17-alpine@sha256:a77aa70e641402a21411b92b721c58d10f23b50ae5fdd2333efd22d166e1e5f7
    restart: unless-stopped
    environment:
      POSTGRES_USER: energytool
      POSTGRES_PASSWORD: energytool
      POSTGRES_DB: energytool
    ports: ["127.0.0.1:${EB_DB_PORT:-5433}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U energytool -d energytool"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes: ["pgdata:/var/lib/postgresql/data"]

  # Общее хранилище пределов частоты: с ним пределы верны при любом
  # числе реплик api. Без него api считает пределы в памяти.
  redis:
    image: redis:7-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  # База шлюза к моделям: ключи служб, их пределы и расход. Отдельный
  # сервер, а не схема в db: LiteLLM сам ведёт свою схему (Prisma), и
  # пускать её в базу с заявками незачем.
  llm-db:
    image: postgres:17-alpine@sha256:a77aa70e641402a21411b92b721c58d10f23b50ae5fdd2333efd22d166e1e5f7
    restart: unless-stopped
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: litellm
      POSTGRES_DB: litellm
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes: ["llmdb:/var/lib/postgresql/data"]

  # Шлюз к моделям (llm-gateway/, LiteLLM). Реальный провайдер — из .env
  # (LLM_BASE_URL, LLM_API_KEY, LLM_MODEL…): compose подставляет их сюда сам.
  # Запасной провайдер — GW_FALLBACK_* в .env; без них запаса нет.
  llm-gateway:
    build:
      context: ./llm-gateway
    image: energytool-llm-gateway:local
    restart: unless-stopped
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-dev-gateway}
      GW_BASE_URL: ${LLM_BASE_URL:-}
      GW_API_KEY: ${LLM_API_KEY:-}
      GW_CHAT_MODEL: openai/${LLM_MODEL:-qwen/qwen3.8-27b}
      GW_EMBED_MODEL: openai/${EMB_MODEL:-baai/bge-m3}
      GW_RERANK_MODEL: hosted_vllm/${RERANKER_MODEL:-qwen/qwen3-reranker-8b}
      GW_FALLBACK_BASE_URL: ${GW_FALLBACK_BASE_URL:-}
      GW_FALLBACK_API_KEY: ${GW_FALLBACK_API_KEY:-}
      GW_FALLBACK_CHAT_MODEL: ${GW_FALLBACK_CHAT_MODEL:-}
      # Распознавание фото документов (T9) — только OCR. Пусто — псевдонима
      # energy-vision нет, api фото не принимает.
      GW_VISION_MODEL: ${GW_VISION_MODEL:-}
      DATABASE_URL: postgresql://litellm:litellm@llm-db:5432/litellm
      # Ключи служб: у каждой свои модели и пределы (llm-gateway/keys.py).
      # Здесь — значения для разработки; на хостинге — свои.
      GW_KEY_CORE: ${GW_KEY_CORE:-sk-dev-core-0123456789abcdef}
      GW_KEY_API: ${GW_KEY_API:-sk-dev-api-0123456789abcdef}
    depends_on:
      llm-db:
        condition: service_healthy
    # Наружу не публикуется: к нему ходят ядро и api по сети compose.
    # Для отладки напрямую — раскомментировать.
    # ports: ["127.0.0.1:4000:4000"]
    healthcheck:
      # Готов — когда отвечает и ключи служб уже в базе (/tmp/gw-ready):
      # ядро, пришедшее со своим ключом раньше них, получило бы 401.
      test: ["CMD", "python", "-c", "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=2); assert os.path.exists('/tmp/gw-ready')"]
      start_period: 180s
      start_interval: 2s
      interval: 30s
      timeout: 5s
      retries: 3

  core:
    build:
      context: .
      dockerfile: core/Dockerfile
    image: energytool-core:local
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      EB_CORE_HOST: 0.0.0.0
      EB_CORE_PORT: "8788"
      # Модель — через шлюз, по псевдонимам. Перекрывают значения из .env:
      # там адрес и ключ провайдера, а их знает только шлюз. Пустые
      # отдельные адреса и ключи — эмбеддинги и реранкер тоже через шлюз.
      LLM_BASE_URL: http://llm-gateway:4000/v1
      LLM_API_KEY: ${GW_KEY_CORE:-sk-dev-core-0123456789abcdef}
      LLM_MODEL: energy-chat
      EMB_MODEL: energy-embed
      RERANKER_MODEL: energy-rerank
      EB_EMBEDDER_BASE_URL: ""
      EB_RERANKER_BASE_URL: ""
      EMBEDDER_API_KEY: ""
      RERANKER_API_KEY: ""
      # Кеш векторов базы: перезапуск ядра — секунды и один запрос к модели,
      # а не пересчёт всей базы (scripts/index_cache.py).
      EB_INDEX_CACHE_DIR: /data/index
      # Общий секрет с API. Здесь дев-значение; на хостинге — свой.
      EB_CORE_TOKEN: ${EB_CORE_TOKEN:-dev-core-token}
    volumes: ["core-index:/data/index"]
    # Наружу ядро не публикуется: к нему ходит только api по сети
    # compose. Для отладки ядра напрямую — раскомментировать.
    # ports: ["127.0.0.1:8788:8788"]
    # Ядро на старте считает эмбеддинги базы — шлюз должен уже отвечать.
    depends_on:
      llm-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8788/healthz', timeout=2)"]
      # Ядро на старте читает базу знаний и, при включённых эмбеддингах,
      # считает векторы через API модели — это десятки секунд.
      start_period: 180s
      start_interval: 3s
      interval: 30s
      timeout: 5s
      retries: 3

  api:
    build:
      context: ./backend
    image: energytool-api:local
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      # Разработку объявляем явно: молчание об окружении означает бой,
      # а бой без EB_API_TOKEN api запускать откажется.
      EB_ENV: ${EB_ENV:-development}
      EB_DB_DSN: postgres://energytool:energytool@db:5432/energytool?sslmode=disable
      EB_CORE_URL: http://core:8788
      EB_CORE_TOKEN: ${EB_CORE_TOKEN:-dev-core-token}
      EB_API_TOKEN: ${EB_API_TOKEN:-}
      # Глобальные настройки RAG (/settings) — только с этим токеном; пусто — только песочница.
      EB_ADMIN_TOKEN: ${EB_ADMIN_TOKEN:-}
      # Разговоры и заявки клиентов (GET /api/sessions/:id, экран менеджера) —
      # только с этим токеном; пусто — закрыто для всех.
      EB_MANAGER_TOKEN: ${EB_MANAGER_TOKEN:-}
      EB_ALLOWED_ORIGINS: http://localhost:3000
      EB_REDIS_URL: redis://redis:6379/0
      # Резюме заявок — через шлюз, тем же псевдонимом, что ответы ядра,
      # но со своим ключом: только energy-chat и свои пределы.
      LLM_BASE_URL: http://llm-gateway:4000/v1
      LLM_API_KEY: ${GW_KEY_API:-sk-dev-api-0123456789abcdef}
      LLM_MODEL: energy-chat
      # Текст с фото документа (T9) — псевдоним шлюза, если GW_VISION_MODEL
      # задан; иначе пусто, и кнопка вложения неактивна.
      EB_VISION_MODEL: ${GW_VISION_MODEL:+energy-vision}
    ports:
      - "127.0.0.1:${EB_API_PORT:-8787}:8080"
      - "127.0.0.1:${EB_METRICS_PORT:-9091}:9091"
    # Остановка ждёт текущие ответы до EB_CORE_TIMEOUT (3 минуты) — по
    # умолчанию docker убивает процесс через 10 секунд, и ответы
    # обрывались бы на середине.
    stop_grace_period: 4m
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      # Шлюз нужен только резюме заявок: без него заявка всё равно
      # принимается со списком вопросов.
      llm-gateway:
        condition: service_started
      # Только старт, не готовность: api без ядра всё равно принимает
      # заявки и оценки, а /api/health честно скажет, что ядро
      # поднимается.
      core:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz || exit 1"]
      start_period: 30s
      start_interval: 2s
      interval: 30s
      timeout: 3s
      retries: 3

  # Стенд и виджет (web/, Next standalone). Браузер ходит только сюда:
  # /api/* сервер Next проксирует в api по сети compose, подставляя
  # EB_API_TOKEN, — адрес и токен API в браузер не попадают.
  web:
    build:
      context: ./web
    image: energytool-web:local
    restart: unless-stopped
    environment:
      EB_API_URL: http://api:8080
      EB_API_TOKEN: ${EB_API_TOKEN:-}
      # Вход администратора на /settings — тот же токен, что у api; пусто — только песочница.
      EB_ADMIN_TOKEN: ${EB_ADMIN_TOKEN:-}
    ports: ["127.0.0.1:${EB_WEB_PORT:-3000}:3000"]
    # Только старт api: стенд открывается сразу, а пока api и ядро
    # поднимаются, прокси честно отвечает «API не запущен».
    depends_on:
      api:
        condition: service_started
    # Healthcheck — в образе (web/Dockerfile): статика /widget.js.

  # Сбор метрик api и шлюза, правила тревог (monitoring/). Интерфейс —
  # http://localhost:9090, вкладка Alerts — сработавшие правила.
  prometheus:
    build:
      context: ./monitoring
    image: energytool-prometheus:local
    restart: unless-stopped
    environment:
      API_TARGET: api:9091
      GATEWAY_TARGET: llm-gateway:4000
      STAND: local
    ports: ["127.0.0.1:${EB_PROMETHEUS_PORT:-9090}:9090"]
    volumes: ["prom-data:/prometheus"]
    depends_on:
      api:
        condition: service_started

  # Дашборды поверх Prometheus (monitoring/grafana/): provisioning и
  # дашборды монтируются из репозитория, руками в интерфейсе настраивать
  # нечего. Интерфейс — http://localhost:3001; вход — admin и пароль из
  # GF_SECURITY_ADMIN_PASSWORD. Без него — пароль разработки, как у других
  # служебных секретов этого файла: стенд поднимается одной командой (T28),
  # а порт слушает только петля. На хостинге пароль задаётся свой
  # (docs/deploy.md) — admin/admin Grafana не получает ни там, ни тут.
  grafana:
    image: grafana/grafana:12.3.0@sha256:70d9599b186ce287be0d2c5ba9a78acb2e86c1a68c9c41449454d0fc3eeb84e8
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-dev-grafana-local}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      PROMETHEUS_URL: http://prometheus:9090
    ports: ["127.0.0.1:${EB_GRAFANA_PORT:-3001}:3000"]
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    depends_on:
      prometheus:
        condition: service_started

volumes:
  pgdata:
  llmdb:
  core-index:
  prom-data:
  grafana-data:
