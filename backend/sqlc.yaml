version: "2"
sql:
  - engine: postgresql
    # Схема — сами миграции, а не отдельный файл: второй экземпляр
    # схемы однажды разъедется с первым, и sqlc сгенерирует код под
    # базу, которой нет.
    schema: migrations
    queries: queries
    gen:
      go:
        package: db
        out: internal/storage/postgres/db
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        emit_empty_slices: true
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "timestamptz"
            go_type: "time.Time"
