<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>МТС EnergyTool — ИИ-консультант</title>
<style>
  :root { --red:#e30611; --bg:#f2f3f5; --card:#fff; --text:#1d2023; --muted:#6b7280; }
  * { box-sizing: border-box; margin: 0; }
  body { font-family: "MTS Sans", -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; }
  header { background: var(--red); color: #fff; padding: 12px 20px; display: flex; align-items: center; gap: 12px; }
  header h1 { font-size: 17px; font-weight: 600; flex: 1; }
  header button, header a { background: rgba(255,255,255,.15); color:#fff; border: 0; border-radius: 8px; padding: 7px 12px; font-size: 13px; cursor: pointer; text-decoration: none; }
  #chat { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 10px; max-width: 860px; width: 100%; margin: 0 auto; }
  .msg { max-width: 78%; padding: 10px 14px; border-radius: 14px; line-height: 1.45; font-size: 15px; white-space: pre-wrap; }
  .user { align-self: flex-end; background: var(--red); color: #fff; border-bottom-right-radius: 4px; }
  .bot { align-self: flex-start; background: var(--card); border-bottom-left-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  .meta { display: none; margin-top: 8px; padding-top: 8px; border-top: 1px dashed #ddd; font-size: 12px; color: var(--muted); }
  body.debug .meta { display: block; }
  .meta code { background:#f3f4f6; padding: 1px 4px; border-radius: 4px; }
  #bar { display: flex; gap: 8px; padding: 12px 18px; max-width: 860px; width: 100%; margin: 0 auto; }
  #bar input { flex: 1; padding: 12px 14px; border: 1px solid #d7d9dd; border-radius: 12px; font-size: 15px; }
  #bar button, #leadBtn { background: var(--red); color: #fff; border: 0; border-radius: 12px; padding: 12px 18px; font-size: 15px; cursor: pointer; }
  #leadBtn { background: #fff; color: var(--red); border: 1px solid var(--red); }
  #bar button:disabled { opacity: .5; }
  #leadForm { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); align-items: center; justify-content: center; }
  #leadForm.open { display: flex; }
  #leadForm .card { background: #fff; border-radius: 16px; padding: 22px; width: 380px; display: flex; flex-direction: column; gap: 10px; }
  #leadForm input { padding: 10px 12px; border: 1px solid #d7d9dd; border-radius: 10px; font-size: 14px; }
  #leadForm h2 { font-size: 16px; }
  #leadForm .note { font-size: 12px; color: var(--muted); }
  #toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: #1d2023; color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 14px; display: none; }
</style>
</head>
<body>
<header>
  <h1>МТС EnergyTool · ИИ-консультант</h1>
  <button id="debugBtn" title="Режим отладки">Отладка</button>
  <button id="newBtn">Новый диалог</button>
</header>
<div id="chat"></div>
<div id="bar">
  <input id="text" placeholder="Опишите вашу задачу…" autocomplete="off">
  <button id="sendBtn">Отправить</button>
  <button id="leadBtn" title="Передать заявку менеджеру">Заявка</button>
</div>
<form id="leadForm">
  <div class="card">
    <h2>Заявка менеджеру</h2>
    <input name="name" placeholder="ФИО" required minlength="2">
    <input name="phone" placeholder="Телефон" required>
    <input name="company" placeholder="Компания" required>
    <div class="note">Менеджер получит резюме этого диалога. Демонстрация — указывайте тестовые контакты.</div>
    <button type="submit">Отправить заявку</button>
    <button type="button" id="leadCancel" style="background:#eee;color:#333">Отмена</button>
  </div>
</form>
<div id="toast"></div>
<script>
let sessionId = localStorage.getItem("eb_session");
const chat = document.getElementById("chat"), text = document.getElementById("text");
const sendBtn = document.getElementById("sendBtn");
const toast = (m) => { const t = document.getElementById("toast"); t.textContent = m; t.style.display = "block"; setTimeout(() => t.style.display = "none", 4000); };

async function newSession() {
  const r = await fetch("/api/session", {method: "POST"});
  sessionId = (await r.json()).session_id;
  localStorage.setItem("eb_session", sessionId);
  chat.innerHTML = "";
  addMsg("bot", "Здравствуйте! Я консультант МТС EnergyTool. Расскажите о вашей задаче — учёт энергоресурсов, снижение расходов, потери — и я подберу решение.", {action: "greeting"});
}
function esc(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
function addMsg(who, body, meta) {
  const d = document.createElement("div");
  d.className = "msg " + who;
  let html = esc(body);
  if (meta && who === "bot") {
    const src = (meta.sources || []).map(s => `<code>${esc(s[0])} · ${esc(s[1])}</code>`).join(" ");
    const tm = meta.timings_ms ? `поиск ${meta.timings_ms.retrieval ?? 0} мс · генерация ${meta.timings_ms.generation ?? 0} мс · всего ${meta.timings_ms.total ?? 0} мс` : "";
    html += `<div class="meta">${esc(meta.action || "")} ${meta.error ? "· ошибка: " + esc(meta.error) : ""}<br>${tm}<br>${src}</div>`;
  }
  d.innerHTML = html;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
}
async function send() {
  const message = text.value.trim();
  if (!message) return;
  text.value = ""; sendBtn.disabled = true;
  addMsg("user", message);
  try {
    const r = await fetch("/api/chat", {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({session_id: sessionId, request_id: crypto.randomUUID(), message})});
    const data = await r.json();
    if (!r.ok) { addMsg("bot", "⚠ " + (data.detail || "временный сбой, попробуйте ещё раз")); }
    else {
      addMsg("bot", data.text, data);
      if (data.suggest_lead) {
        toast("Похоже, вопрос сложный — предлагаем передать его специалисту");
        document.getElementById("leadForm").classList.add("open");
      }
    }
  } catch (e) { addMsg("bot", "⚠ Нет связи с сервером. Попробуйте ещё раз."); }
  sendBtn.disabled = false; text.focus();
}
sendBtn.onclick = send;
text.addEventListener("keydown", e => { if (e.key === "Enter") send(); });
document.getElementById("newBtn").onclick = async () => {
  if (sessionId) fetch(`/api/session/${sessionId}/close`, {method: "POST"});
  localStorage.removeItem("eb_session");
  await newSession();
};
document.getElementById("debugBtn").onclick = () => document.body.classList.toggle("debug");
document.getElementById("leadBtn").onclick = () => document.getElementById("leadForm").classList.add("open");
document.getElementById("leadCancel").onclick = () => document.getElementById("leadForm").classList.remove("open");
document.getElementById("leadForm").onsubmit = async (e) => {
  e.preventDefault();
  const f = e.target;
  const body = {session_id: sessionId, request_id: crypto.randomUUID(),
    name: f.name.value, phone: f.phone.value, company: f.company.value};
  const r = await fetch("/api/lead", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
  const data = await r.json();
  f.classList.remove("open");
  if (r.ok) { addMsg("bot", `Заявка №${data.lead_id} сохранена, менеджер получил резюме диалога. Спасибо!`); f.reset(); }
  else toast(data.detail || "Не удалось сохранить заявку");
};
(async () => {
  if (sessionId) {
    const r = await fetch("/api/history/" + sessionId);
    if (r.ok) {
      const h = await r.json();
      chat.innerHTML = "";
      for (const t of h.turns) { addMsg("user", t.user); addMsg("bot", t.bot, t); }
      if (h.turns.length) return;
    }
    localStorage.removeItem("eb_session");
  }
  await newSession();
})();
</script>
</body>
</html>
