# Линтер для всего Python-кода репозитория (решение, стенд, скрипты, тесты).
line-length = 120
target-version = "py39"
extend-exclude = ["sample_submission"]  # учебный пример организаторов — не правим

[lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",   # длинные строки — в основном русские тексты промптов и сообщений
    "UP006", "UP007", "UP035", "UP045",  # совместимость аннотаций с Python 3.9 на платформе
    "B008",
]

[lint.per-file-ignores]
"solution.py" = ["E402"]       # sys.path настраивается до импортов модулей решения
"eval/*.py" = ["E402"]
"scripts/*.py" = ["E402"]
"tests/*.py" = ["E402"]
