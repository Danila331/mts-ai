name: CI

# Каждый PR и каждый пуш в dev/main: линтер, тесты и детерминированная сверка
# сабмита с техническим регламентом. TypeScript-шаги включаются сами, когда в
# репозитории появится web/package.json.

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python — линтер, тесты, сабмит
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Зависимости
        run: pip install -r requirements-dev.txt

      - name: Линтер (ruff)
        run: ruff check . --output-format github

      - name: Тесты
        run: python -m unittest discover -s tests -v

      - name: Сверка сабмита с регламентом (сборка ZIP, чистое окружение, формат CSV)
        run: python scripts/check_submission.py --report check.md

      - name: Отчёт сверки
        if: always()
        run: if [ -f check.md ]; then cat check.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: ZIP сабмита
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: submission-zip
          path: dist/submission.zip
          retention-days: 14

  typescript:
    name: TypeScript — линтер и тесты
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Есть ли TypeScript-проект
        id: detect
        working-directory: .
        run: |
          if [ -f web/package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT";
          else echo "present=false" >> "$GITHUB_OUTPUT"; echo "web/package.json нет — TypeScript-проверки пропущены" >> "$GITHUB_STEP_SUMMARY"; fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.detect.outputs.present == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Зависимости
        if: steps.detect.outputs.present == 'true'
        run: npm ci

      - name: Линтер
        if: steps.detect.outputs.present == 'true'
        run: npm run lint --if-present

      - name: Проверка типов
        if: steps.detect.outputs.present == 'true'
        run: if [ -f tsconfig.json ]; then npx tsc --noEmit; fi

      - name: Тесты
        if: steps.detect.outputs.present == 'true'
        run: npm test --if-present

  widget-size:
    name: Виджет — размер widget.js (≤ 8 КБ gzip)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Зависимости
        run: npm ci

      - name: Сборка и бюджет размера
        run: npm run check:widget

  a11y:
    name: Доступность — Playwright + axe (WCAG 2.2 AA)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Зависимости
        run: npm ci

      - name: Браузер Playwright
        run: npx playwright install --with-deps chromium

      - name: Сборка
        run: npm run build

      - name: axe на /playground, /embed, /kb — 0 нарушений serious и critical
        run: npm run test:a11y

      - name: Отчёт Playwright
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

  workflows:
    name: GitHub Actions — actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.7@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9
        with:
          args: -color
