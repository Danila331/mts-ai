name: CI

# Каждый PR и каждый пуш в dev/main: линтер, тесты и детерминированная сверка
# сабмита с техническим регламентом. TypeScript-шаги включаются сами, когда в
# репозитории появится web/package.json.

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python — линтер, тесты, сабмит
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Зависимости
        run: pip install -r requirements-dev.txt

      - name: Линтер (ruff)
        run: ruff check . --output-format github

      - name: Тесты
        run: python -m unittest discover -s tests -v

      - name: Сверка сабмита с регламентом (сборка ZIP, чистое окружение, формат CSV)
        run: python scripts/check_submission.py --report check.md

      - name: Отчёт сверки
        if: always()
        run: if [ -f check.md ]; then cat check.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: ZIP сабмита
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: submission-zip
          path: dist/submission.zip
          retention-days: 14

  typescript:
    name: TypeScript — линтер и тесты
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Есть ли TypeScript-проект
        id: detect
        working-directory: .
        run: |
          if [ -f web/package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT";
          else echo "present=false" >> "$GITHUB_OUTPUT"; echo "web/package.json нет — TypeScript-проверки пропущены" >> "$GITHUB_STEP_SUMMARY"; fi

      - uses: actions/setup-node@v4
        if: steps.detect.outputs.present == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Зависимости
        if: steps.detect.outputs.present == 'true'
        run: npm ci

      - name: Линтер
        if: steps.detect.outputs.present == 'true'
        run: npm run lint --if-present

      - name: Проверка типов
        if: steps.detect.outputs.present == 'true'
        run: if [ -f tsconfig.json ]; then npx tsc --noEmit; fi

      - name: Тесты
        if: steps.detect.outputs.present == 'true'
        run: npm test --if-present

  workflows:
    name: GitHub Actions — actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color
