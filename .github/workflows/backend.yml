name: Backend

# Ворота бэкенда перед выкладкой: Go-API и образы обеих служб.
#
# Railway выкладывает main сам («Wait for CI» в настройках службы) — но
# только после того, как этот прогон на том же коммите зелёный. Поэтому
# красное здесь в бой не едет, а слияние dev → main и есть выкладка
# (docs/deploy.md).

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go — формат, vet, sqlc, тесты
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      # Тесты хранилища идут против настоящего Postgres той же версии,
      # что на Railway: моки базы проверяют моки.
      postgres:
        image: postgres:17-alpine@sha256:a77aa70e641402a21411b92b721c58d10f23b50ae5fdd2333efd22d166e1e5f7
        env:
          POSTGRES_USER: energytool
          POSTGRES_PASSWORD: energytool
          POSTGRES_DB: energytool
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U energytool"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Форматирование и vet
        run: |
          # gofmt -l печатает файлы и ничего не возвращает кодом: без
          # этой обёртки шаг всегда зелёный.
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "не отформатировано:"; echo "$unformatted"; exit 1
          fi
          go vet ./...

      - uses: sqlc-dev/setup-sqlc@c0209b9199cd1cce6a14fc27cabcec491b651761 # v4.0.0
        with:
          sqlc-version: "1.31.1"

      - name: Код запросов совпадает с queries/ и migrations/
        # Правка запроса без make sqlc собирается и проходит тесты на
        # старом коде — расхождение ловит только эта проверка.
        run: sqlc diff

      - name: Тесты
        env:
          TEST_DATABASE_URL: postgres://energytool:energytool@localhost:5432/energytool?sslmode=disable
        run: go test ./... -count=1

  images:
    name: Образы и сквозная проверка
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Пароль Grafana из compose.yaml обязателен; в CI — одноразовый.
      GF_SECURITY_ADMIN_PASSWORD: ci-grafana-password
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Тот же compose.yaml, что у разработчика: собираются все образы
      # (web, api, core, шлюз, Prometheus, Grafana), поднимается весь стенд, и
      # запросы браузера проходят насквозь — через прокси Next до базы.
      # Ключа модели в CI нет — ядро отвечает заглушкой, а
      # проверяется связность служб, а не качество ответа.
      # Конфиг и правила Prometheus проверяет promtool из того же образа,
      # что едет в бой: опечатка в PromQL иначе всплыла бы только тем, что
      # тревога молча не срабатывает.
      - name: Конфиг и правила Prometheus
        run: |
          docker run --rm -v "$PWD/monitoring:/m:ro" --entrypoint /bin/sh prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06 -c '
            sed -e "s|\${API_TARGET}|api:9091|g" -e "s|\${GATEWAY_TARGET}|llm-gateway:4000|g" \
                -e "s|\${STAND}|ci|g" -e "s|/etc/prometheus/rules.yml|/m/rules.yml|" \
                /m/prometheus.yml.tmpl > /prometheus/ci.yml &&
            promtool check config /prometheus/ci.yml && promtool check rules /m/rules.yml'

      - name: Сборка и запуск
        env:
          EB_API_TOKEN: ci-token
          EB_MANAGER_TOKEN: ci-manager
        run: docker compose up --build --wait --wait-timeout 300

      - name: Запросы фронта
        env:
          SMOKE_MANAGER_TOKEN: ci-manager
        run: sh backend/scripts/smoke.sh http://127.0.0.1:8787 ci-token http://127.0.0.1:3000

      # Grafana здорова (healthcheck в compose уже дождался её в --wait),
      # вход только с паролем, а дашборды из monitoring/grafana подгрузились.
      - name: Grafana и дашборды
        run: |
          curl -fsS http://127.0.0.1:3001/api/health | tee /dev/stderr | grep -q '"database": *"ok"'
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3001/api/search)
          if [ "$code" != 401 ]; then echo "анонимный доступ к Grafana: $code"; exit 1; fi
          n=0
          for _ in $(seq 1 20); do
            n=$(curl -fsS -u "admin:$GF_SECURITY_ADMIN_PASSWORD" "http://127.0.0.1:3001/api/search?type=dash-db" | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))')
            [ "$n" -ge 3 ] && break
            sleep 3
          done
          echo "дашбордов: $n"
          [ "$n" -ge 3 ]
          curl -fsS -u "admin:$GF_SECURITY_ADMIN_PASSWORD" http://127.0.0.1:3001/api/datasources/uid/prometheus | grep -q '"type": *"prometheus"'

      - name: Ответ, заявка и оценка легли в базу
        run: |
          for table in answers leads feedback sessions; do
            n=$(docker compose exec -T db psql -U energytool -d energytool -tAc "SELECT count(*) FROM $table")
            if [ "$n" -lt 1 ]; then echo "$table: пусто"; exit 1; fi
            echo "$table: $n"
          done

      - name: Журналы служб
        if: failure()
        run: docker compose logs --no-color

      - name: Остановка
        if: always()
        run: docker compose down -v
