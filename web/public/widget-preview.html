<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Превью виджета</title>
    <style>
      /* Страница-заглушка для превью на /widget: внутри — настоящий widget.js с настройками из адреса. */
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        background-color: #f2f3f7;
        background-image: radial-gradient(rgb(29 32 35 / 0.09) 1px, transparent 1px);
        background-size: 18px 18px;
        font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        color: #626c77;
        display: grid;
        place-items: center;
        overflow: hidden;
      }
      .label {
        padding: 6px 12px;
        border-radius: 999px;
        background: rgb(255 255 255 / 0.8);
        box-shadow: 0 0 0 1px rgb(29 32 35 / 0.06);
      }
    </style>
  </head>
  <body>
    <span class="label">Страница вашего сайта</span>
    <script>
      (function () {
        var p = new URLSearchParams(location.search);
        var s = document.createElement("script");
        s.src = "/widget.js?v=" + Date.now();
        s.async = true;
        ["title", "color", "position", "greeting", "greetingDelay", "quick", "open", "topics"].forEach(function (k) {
          var v = p.get(k);
          if (v !== null) s.dataset[k] = v;
        });
        // Страница сайта, которую изображает превью: виджет читает location.pathname и берёт тему из data-topics.
        var path = p.get("path");
        if (path && /^\/[^\s"'<>]{0,199}$/.test(path)) history.replaceState(null, "", path);
        try {
          sessionStorage.removeItem("energytool-chat:greeted");
          sessionStorage.removeItem("energytool-chat:open");
        } catch (e) {}
        document.body.appendChild(s);
      })();
    </script>
  </body>
</html>
